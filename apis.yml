name: Souco
description: >-
  Souco (株式会社souco / souco Co., Ltd.) operates a warehouse-sharing marketplace and
  logistics resource optimization platform in Japan, connecting cargo owners with available
  space across a nationwide network of 3,000+ warehouses spanning all 47 prefectures.
  Businesses can secure short- or long-term storage on demand for a wide range of cargo —
  food ingredients, apparel, machinery, and documents — under ambient, refrigerated, frozen,
  or temperature-controlled conditions, with pickup and delivery coordination handled by the
  platform. Alongside the sharing marketplace, souco offers a rental-warehouse search portal,
  transportation services, and the Optis engine for optimizing logistics networks, plus
  consulting and DX support for the logistics industry. The company is backed by 500 Global
  and Sumitomo Corporation's corporate venture arm. souco is a customer-facing logistics
  platform and does not currently publish a public developer API, SDKs, or developer
  documentation; its digital surface is a login-gated web application at app.souco.space.
